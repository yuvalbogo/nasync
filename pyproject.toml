[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "samba-sync-auto"
version = "0.1.0"
description = "Automatic SAMBA-based sync tool for home NAS backup"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Yuval Bogo", email = "yuvalbogo2@gmail.com"},
]
keywords = ["samba", "sync", "backup", "nas", "home-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "click==8.1.7",
    "watchdog==3.0.0",
    "appdirs==1.4.4",
]

[project.optional-dependencies]
dev = [
    "black==23.7.0",
    "flake8==6.0.0",
    "pytest==7.4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ServerSyncAuto"
Documentation = "https://github.com/yourusername/ServerSyncAuto/blob/main/README.md"
Repository = "https://github.com/yourusername/ServerSyncAuto.git"
Issues = "https://github.com/yourusername/ServerSyncAuto/issues"

[project.scripts]
samba-sync = "samba_sync.cli:main"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["samba_sync"]
python_files = ["test_*.py"]
