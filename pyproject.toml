[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nasync"
# Single source of truth: nasync/__init__.py:__version__ (see [tool.setuptools.dynamic])
dynamic = ["version"]
description = "NASync — sync your local folders to a SAMBA home NAS, with class"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yuval Bogo", email = "yuvalbogo2@gmail.com"},
]
keywords = ["samba", "sync", "backup", "nas", "home-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "click==8.1.7",
    "watchdog==3.0.0",
    "appdirs==1.4.4",
    # SMB 2/3 transport. Deliberately not pinned exactly: it carries the crypto
    # and network handling, so patch releases should reach users unimpeded.
    "smbprotocol>=1.12",
    # Encrypts the saved-passwords file. Already present as a dependency of
    # smbprotocol, but named here too: relying on a transitive dependency for
    # something security-relevant means an unrelated change upstream can
    # silently downgrade credential storage to plaintext.
    "cryptography>=41",
    # The Secret Service client, for the key that encrypts that file outside a
    # Flatpak. Pure Python over jeepney, so it adds no compiled dependency.
    # Inside a sandbox the secret portal is used instead and this goes unused.
    # 3.5 for Collection.unlock(timeout=...). Older releases are still handled
    # at the call site, because a pipx install made with --system-site-packages
    # picks up the distro's copy — 3.3 on Debian 12 and Ubuntu 22.04/24.04.
    "secretstorage>=3.5",
]

[project.optional-dependencies]
dev = [
    "black==23.7.0",
    "flake8==6.0.0",
    "pytest==7.4.0",
]

[project.urls]
Homepage = "https://github.com/YuvalBogo/nasync"
Documentation = "https://github.com/YuvalBogo/nasync/blob/main/README.md"
Repository = "https://github.com/YuvalBogo/nasync.git"
Issues = "https://github.com/YuvalBogo/nasync/issues"

[project.scripts]
nasync = "nasync.cli:main"

[tool.setuptools]
packages = ["nasync", "nasync.core", "nasync.system", "nasync.gui"]

[tool.setuptools.dynamic]
version = {attr = "nasync.__version__"}

[tool.setuptools.package-data]
nasync = ["assets/nasync.svg"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
