[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nasync"
version = "0.2.0"
description = "NASync — sync your local folders to a SAMBA home NAS, with class"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Yuval Bogo", email = "yuvalbogo2@gmail.com"},
]
keywords = ["samba", "sync", "backup", "nas", "home-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "click==8.1.7",
    "watchdog==3.0.0",
    "appdirs==1.4.4",
]

[project.optional-dependencies]
tui = [
    "textual>=0.60",
]
dev = [
    "black==23.7.0",
    "flake8==6.0.0",
    "pytest==7.4.0",
    "textual>=0.60",
]

[project.urls]
Homepage = "https://github.com/YuvalBogo/nasync"
Documentation = "https://github.com/YuvalBogo/nasync/blob/main/README.md"
Repository = "https://github.com/YuvalBogo/nasync.git"
Issues = "https://github.com/YuvalBogo/nasync/issues"

[project.scripts]
nasync = "nasync.cli:main"

[tool.setuptools]
packages = ["nasync"]

[tool.setuptools.package-data]
nasync = ["assets/nasync.svg"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["nasync"]
python_files = ["test_*.py"]
